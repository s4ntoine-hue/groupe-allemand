<style>

  --accent: #8aa8f0; --accent-ink: #10131a; --gold: #f0bd52; --today: #ff7a6e; --pin: #3a3423;
    --cat-cours: #7ea2ff; --cat-revision: #4fd19a; --cat-conversation: #ffad4d; --cat-culture: #c79bff; --cat-sortie: #ff7a6e; --cat-autre: #a2a7b4;
  color-scheme: dark;

* { box-sizing: border-box; }

.wrap { max-width: 1180px; margin: 0 auto; padding-block: 20px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 20px; }

<div class="wrap">
  <div class="top">
    <div>

    <div class="topbtns">

        <button class="btn small" id="thisweek">Aujourd'hui</button>
        <button class="btn small" id="next" aria-label="Période suivante">→</button>
      </div>
    </div>
    <div class="filters" id="filters">
      <label for="flt-city">Autour de <select id="flt-city"><option value="">partout</option></select></label>
      <label for="flt-radius">dans un rayon de <select id="flt-radius">
        <option value="10">10 km</option><option value="20">20 km</option><option value="30">30 km</option><option value="50">50 km</option><option value="100">100 km</option></select></label>
      <span id="flt-progs" style="display:contents"></span>
      <span class="hint" id="flt-info"></span>
    </div>
    <div class="legend" id="legend" aria-label="Catégories : touchez pour masquer ou afficher"></div>
    <div class="cal" id="board" style="margin-top:12px"></div>
    <div class="dayview" id="dayview"></div>
    <div class="upcoming" id="upcoming" hidden></div>
  </section>

  <section id="view-list" hidden>
    <div class="list" id="list"></div>
  </section>
</div>

<div class="overlay" id="overlay" hidden></div>
